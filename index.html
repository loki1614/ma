<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>I Love You Kutty ❤️</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        overflow: hidden;
        background: #000;
        height: 100vh;
        font-family: Arial, sans-serif;
    }

    canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
    }

    .message {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 10;
        color: white;
        width: 100%;
        pointer-events: none;
    }

    .heart {
        font-size: 110px;
        animation: heartbeat 1.2s infinite;
        filter: drop-shadow(0 0 20px #ff1744);
    }

    h1 {
        margin-top: 15px;
        font-size: 42px;
        color: #ff4d6d;
        text-shadow:
            0 0 10px #ff1744,
            0 0 20px #ff1744,
            0 0 40px #ff1744;
    }

    p {
        margin-top: 10px;
        font-size: 22px;
        color: #fff;
        opacity: 0.9;
        letter-spacing: 2px;
    }

    @keyframes heartbeat {
        0% { transform: scale(1); }
        20% { transform: scale(1.2); }
        40% { transform: scale(1); }
        60% { transform: scale(1.15); }
        100% { transform: scale(1); }
    }

    @media (max-width: 600px) {
        .heart { font-size: 80px; }
        h1 { font-size: 30px; }
        p { font-size: 17px; }
    }
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="message">
    <div class="heart">❤️</div>
    <h1>I Love You Kutty</h1>
    <p>Forever &amp; Always ❤️</p>
</div>

<script>
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

let width;
let height;

function resizeCanvas() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}

resizeCanvas();

const characters = ["❤", "♥", "♡", "I", "L", "O", "V", "E", "Y", "O", "U"];

const fontSize = 18;
let columns = Math.floor(window.innerWidth / fontSize);

let drops = [];

function initializeDrops() {
    columns = Math.floor(window.innerWidth / fontSize);
    drops = [];

    for (let i = 0; i < columns; i++) {
        drops[i] = Math.random() * -50;
    }
}

initializeDrops();

function drawMatrix() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
    ctx.fillRect(0, 0, width, height);

    ctx.font = fontSize + "px Arial";

    const colors = ["#ff1744", "#ff4081", "#ff80ab", "#f50057", "#ffffff"];

    for (let i = 0; i < drops.length; i++) {
        const character = characters[Math.floor(Math.random() * characters.length)];
        ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
        ctx.fillText(character, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > height && Math.random() > 0.975) {
            drops[i] = 0;
        }

        drops[i] += 0.7;
    }
}

function animate() {
    drawMatrix();
    requestAnimationFrame(animate);
}

animate();

window.addEventListener("resize", () => {
    resizeCanvas();
    initializeDrops();
});
</script>

</body>
</html>
